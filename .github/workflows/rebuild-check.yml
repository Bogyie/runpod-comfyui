name: rebuild-check

on:
  pull_request:
    paths:
      - 'build/**'
      - 'locks/**'
      - 'tools/**'
      - 'runtime/**'
      - 'tests/**'
      - '!tests/evidence/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rebuild-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned resolver
        run: python -m pip install uv==0.10.8
      - name: Restore development environment from lock
        run: uv sync --frozen
      - name: Reproduce source audit
        run: |
          uv run --frozen python tools/rebuild/snapshot_upstreams.py
          uv run --frozen python tools/rebuild/snapshot_artifact.py
          uv run --frozen python tools/rebuild/audit_upstreams.py
          uv run --frozen python tools/rebuild/prepare_lock_inputs.py
          uv run --frozen python tools/rebuild/prepare_workers.py --verify-locks
          uv export --frozen --no-dev --no-emit-project --no-header --format requirements-txt --output-file locks/tools/requirements.txt
          git diff --exit-code -- build/upstream-audit.json build/inputs locks/tools
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Syntax checks
        run: uv run --frozen python -m compileall -q runtime tools tests
      - name: Validate current image and update workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/rebuild-check.yml .github/workflows/rebuild-image.yml .github/workflows/comfy-update.yml
