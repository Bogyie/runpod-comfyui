name: docker

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/runpod-comfyui
  DOCKERHUB_IMAGE: docker.io/bogyie/runpod-comfyui

jobs:
  build:
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: basic
            optimization_stage: optimized
          - variant: basic-unoptimized
            optimization_stage: unoptimized
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Load Docker build versions
        shell: bash
        run: cat docker.env >> "${GITHUB_ENV}"

      - name: Compute image tags
        id: tags
        shell: bash
        env:
          BUILD_VARIANT: ${{ matrix.variant }}
        run: bash .github/scripts/compute-build-tags.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve existing image
        id: resolve
        run: bash .github/scripts/resolve-image.sh "${{ steps.tags.outputs.build_image }}"

      - name: Tag existing image
        if: steps.resolve.outputs.exists == 'true'
        run: |
          bash .github/scripts/retag-image.sh "${{ steps.resolve.outputs.image_ref }}" \
            "${{ steps.tags.outputs.sha_image }}" \
            "${{ steps.tags.outputs.stable_image }}" \
            "${{ steps.tags.outputs.version_image }}" \
            "${{ github.event_name == 'release' && format('{0}:{1}-{2}', steps.tags.outputs.image_name_lc, github.ref_name, matrix.variant) || '' }}" \
            "${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}" \
            "${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:latest-basic', env.DOCKERHUB_IMAGE) || '' }}" \
            "${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:{1}-basic', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}" \
            "${{ github.event_name == 'release' && matrix.variant == 'basic-unoptimized' && format('{0}:latest-basic-unoptimized', env.DOCKERHUB_IMAGE) || '' }}" \
            "${{ github.event_name == 'release' && matrix.variant == 'basic-unoptimized' && format('{0}:{1}-basic-unoptimized', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}"

      - name: Free disk space
        if: steps.resolve.outputs.exists != 'true'
        run: bash .github/scripts/free-disk-space.sh

      - name: Set up Docker Buildx
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      - name: Build image
        if: steps.resolve.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.basic
          target: basic
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ env.PYTORCH_BASE_IMAGE }}
            OPTIMIZATION_STAGE=${{ matrix.optimization_stage }}
            COMFYUI_REF=${{ env.COMFYUI_REF }}
            TRANSFORMERS_VERSION=${{ env.TRANSFORMERS_VERSION }}
            XFORMERS_VERSION=${{ env.XFORMERS_VERSION }}
            FLASH_ATTN_VERSION=${{ env.FLASH_ATTN_VERSION }}
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CADDY_SECURITY_MODULE=${{ env.CADDY_SECURITY_MODULE }}
            FILEBROWSER_VERSION=${{ env.FILEBROWSER_VERSION }}
            RUNPODCTL_VERSION=${{ env.RUNPODCTL_VERSION }}
            HUGGINGFACE_HUB_VERSION=${{ env.HUGGINGFACE_HUB_VERSION }}
            FILEBROWSER_LINUX_AMD64_SHA256=${{ env.FILEBROWSER_LINUX_AMD64_SHA256 }}
            RUNPODCTL_LINUX_AMD64_SHA256=${{ env.RUNPODCTL_LINUX_AMD64_SHA256 }}
            COMFYUI_MANAGER_REF=${{ env.COMFYUI_MANAGER_REF }}
            KJNODES_REF=${{ env.KJNODES_REF }}
            RGTHREE_REF=${{ env.RGTHREE_REF }}
            CRYSTOOLS_REF=${{ env.CRYSTOOLS_REF }}
          push: true
          tags: |
            ${{ steps.tags.outputs.build_image }}
            ${{ steps.tags.outputs.sha_image }}
            ${{ steps.tags.outputs.stable_image }}
            ${{ steps.tags.outputs.version_image }}
            ${{ github.event_name == 'release' && format('{0}:{1}-{2}', steps.tags.outputs.image_name_lc, github.ref_name, matrix.variant) || '' }}
            ${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
            ${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:latest-basic', env.DOCKERHUB_IMAGE) || '' }}
            ${{ github.event_name == 'release' && matrix.variant == 'basic' && format('{0}:{1}-basic', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}
            ${{ github.event_name == 'release' && matrix.variant == 'basic-unoptimized' && format('{0}:latest-basic-unoptimized', env.DOCKERHUB_IMAGE) || '' }}
            ${{ github.event_name == 'release' && matrix.variant == 'basic-unoptimized' && format('{0}:{1}-basic-unoptimized', env.DOCKERHUB_IMAGE, github.ref_name) || '' }}
          cache-from: |
            type=registry,ref=${{ steps.tags.outputs.image_name_lc }}:cache-${{ matrix.variant }}
            type=registry,ref=${{ steps.tags.outputs.version_image }}
            type=registry,ref=${{ steps.tags.outputs.stable_image }}
          cache-to: |
            type=registry,ref=${{ steps.tags.outputs.image_name_lc }}:cache-${{ matrix.variant }},mode=max
            type=inline

      - name: Verify pushed image
        run: docker buildx imagetools inspect "${{ steps.resolve.outputs.image_ref }}"
