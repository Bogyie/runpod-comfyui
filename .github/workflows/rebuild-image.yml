name: rebuild-image

on:
  push:
    branches: ['codex/rebuild-*']
    paths:
      - 'build/**'
      - 'locks/**'
      - 'docker/Dockerfile.probe'
      - 'tools/**'
      - 'runtime/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/rebuild-*.yml'
      - '.github/scripts/free-disk-space.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/rebuild-check.yml
  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Free disposable runner disk
        run: bash .github/scripts/free-disk-space.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Prepare locked build context
        run: |
          python -m pip install uv==0.10.8
          uv sync --frozen
          uv run --frozen python tools/rebuild/build_probe.py --target runtime-probe --prepare-only
          mkdir -p .work/ci-evidence
      - name: Build identity
        id: identity
        run: |
          uv run --frozen python - <<'PY'
          import os, yaml
          from pathlib import Path
          stack = yaml.safe_load(Path('build/stack.yaml').read_text())
          repository = os.environ['GITHUB_REPOSITORY'].lower()
          tag = f"{stack['candidate']['tag_prefix']}-{os.environ['GITHUB_SHA'][:12]}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          values = {'image': f'ghcr.io/{repository}:{tag}', 'cache': f'ghcr.io/{repository}:cache-rebuild-p0',
                    'base': stack['base_image'], 'uv': stack['resolver']['uv'], 'backend': stack['gpu']['torch_backend'],
                    'attention': stack['gpu']['attention_default'], 'target': stack['candidate']['target'], 'local_image': 'runpod-comfyui:probe-'+stack['candidate']['target']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  print(f'{key}={value}', file=output)
          PY
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Build candidate with registry cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .work/probe-context
          file: docker/Dockerfile.probe
          platforms: linux/amd64
          target: ${{ steps.identity.outputs.target }}
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.identity.outputs.local_image }}
            ${{ steps.identity.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.identity.outputs.base }}
            UV_VERSION=${{ steps.identity.outputs.uv }}
            TORCH_BACKEND=${{ steps.identity.outputs.backend }}
            WORKER_ATTENTION=${{ steps.identity.outputs.attention }}
          cache-from: type=registry,ref=${{ steps.identity.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.identity.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true
      - name: Test candidate before publication
        env:
          LOCAL_IMAGE: ${{ steps.identity.outputs.local_image }}
        run: |
          uv run --frozen python tools/rebuild/probe_host.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/host-before-push.json
          uv run --frozen python tools/rebuild/probe_guards.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/guards-before-push.json
          uv run --frozen python tools/rebuild/probe_workers.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/workers-before-push.json
          uv run --frozen python tools/rebuild/probe_itools.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/itools-before-push.json
          uv run --frozen python tools/rebuild/probe_kjnodes.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/kjnodes-before-push.json
          uv run --frozen python tools/rebuild/probe_vhs.py --image "$LOCAL_IMAGE" --output .work/ci-evidence/vhs-before-push.json
      - name: Build runtime preview from the tested worker layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .work/probe-context
          file: docker/Dockerfile.probe
          platforms: linux/amd64
          target: runtime-probe
          load: true
          push: false
          provenance: false
          tags: ${{ steps.identity.outputs.local_image }}-runtime
          build-args: |
            BASE_IMAGE=${{ steps.identity.outputs.base }}
            UV_VERSION=${{ steps.identity.outputs.uv }}
            TORCH_BACKEND=${{ steps.identity.outputs.backend }}
            WORKER_ATTENTION=${{ steps.identity.outputs.attention }}
      - name: Verify nonroot runtime preview
        env:
          RUNTIME_IMAGE: ${{ steps.identity.outputs.local_image }}-runtime
        run: |
          uv run --frozen python tools/rebuild/probe_runtime.py --image "$RUNTIME_IMAGE" --output .work/ci-evidence/runtime-preview.json
          printf 'Nonroot runtime preview passed locally on this runner. It is a separate image and is not the published worker candidate digest.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify deferred generation lifecycle in runtime preview
        env:
          RUNTIME_IMAGE: ${{ steps.identity.outputs.local_image }}-runtime
        run: |
          uv run --frozen python tools/rebuild/probe_generations.py --image "$RUNTIME_IMAGE" --output .work/ci-evidence/generations-preview.json
      - name: Publish tested candidate with BuildKit
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .work/probe-context
          file: docker/Dockerfile.probe
          platforms: linux/amd64
          target: ${{ steps.identity.outputs.target }}
          push: true
          provenance: false
          tags: ${{ steps.identity.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.identity.outputs.base }}
            UV_VERSION=${{ steps.identity.outputs.uv }}
            TORCH_BACKEND=${{ steps.identity.outputs.backend }}
            WORKER_ATTENTION=${{ steps.identity.outputs.attention }}
      - name: Verify immutable registry image
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          LOCAL_IMAGE: ${{ steps.identity.outputs.local_image }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | python -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$digest" == "$PUBLISHED_DIGEST" ]]
          tested_config=$(docker image inspect "$LOCAL_IMAGE" --format '{{.Id}}')
          registry_config=$(docker buildx imagetools inspect "$IMAGE" --raw | python -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')
          [[ "$registry_config" == "$tested_config" ]]
          TESTED_CONFIG="$tested_config" REGISTRY_CONFIG="$registry_config" IMAGE_DIGEST="$digest" python - <<'PY'
          import json, os
          from pathlib import Path
          Path('.work/ci-evidence/publish.json').write_text(json.dumps({
              'method': 'cached-buildkit-export', 'image_digest': os.environ['IMAGE_DIGEST'],
              'tested_config': os.environ['TESTED_CONFIG'], 'registry_config': os.environ['REGISTRY_CONFIG'],
              'same_tested_image_config': True}, indent=2)+'\n')
          PY
          immutable="${IMAGE%:*}@$digest"
          docker pull "$immutable"
          uv run --frozen python tools/rebuild/probe_host.py --image "$immutable" --output .work/ci-evidence/host-registry.json
          uv run --frozen python tools/rebuild/probe_guards.py --image "$immutable" --output .work/ci-evidence/guards-registry.json
          uv run --frozen python tools/rebuild/probe_workers.py --image "$immutable" --output .work/ci-evidence/workers-registry.json
          uv run --frozen python tools/rebuild/probe_itools.py --image "$immutable" --output .work/ci-evidence/itools-registry.json
          uv run --frozen python tools/rebuild/probe_kjnodes.py --image "$immutable" --output .work/ci-evidence/kjnodes-registry.json
          uv run --frozen python tools/rebuild/probe_vhs.py --image "$immutable" --output .work/ci-evidence/vhs-registry.json
          printf '%s\n' "$immutable" > .work/ci-evidence/image.txt
          printf 'P0 native-worker candidate: `%s`\n\nImmutable image: `%s`\n\nCore CPU workflow, native SAM3/DA3 worker IPC/crash recovery and iTools/KJNodes/VHS CPU/HTTP/data/host-preview/meta-batch gates passed after registry pull. GPU/model gates are separate; this Actions run does not execute them.\n' "$IMAGE" "$immutable" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: p0-image-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/ci-evidence/
          if-no-files-found: warn
