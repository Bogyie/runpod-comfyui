[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/workspace/logs
logfile_maxbytes=10MB
logfile_backups=3

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:comfyui]
command=/etc/services.d/comfyui/run
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/supervisor-comfyui.stdout.log
stderr_logfile=/workspace/logs/supervisor-comfyui.stderr.log

[program:filebrowser]
command=/etc/services.d/filebrowser/run
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/supervisor-filebrowser.stdout.log
stderr_logfile=/workspace/logs/supervisor-filebrowser.stderr.log

[program:caddy]
command=/etc/services.d/caddy/run
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/logs/supervisor-caddy.stdout.log
stderr_logfile=/workspace/logs/supervisor-caddy.stderr.log
