schema_version: 1
status: runtime-candidate
candidate:
  target: runtime-probe
  tag_prefix: candidate-runtime
platform: linux/amd64
python: "3.11"
base_image: python:3.11-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
resolver:
  uv: "0.10.8"
  python_platform: x86_64-manylinux_2_36
gpu:
  cuda: "12.8"
  torch_backend: cu128
  torch: "2.10.0"
  torchvision: "0.25.0"
  torchaudio: "2.10.0"
  xformers: "0.0.35"
  attention_default: pytorch
  targets:
    - name: RTX PRO 6000 Blackwell
      compute_capability: "12.0"
    - name: H100
      compute_capability: "9.0"
isolation:
  package: comfy-env
  version: "0.3.89"
  workspace_variable: COMFY_ENV_ROOT
  policy: prefer-worker-fail-closed
  gpu_verified: false
host_requirements_sources:
  - comfyui
  - manager
  - sam3
  - depth-anything-v3
  - video-helper-suite
runtime_env:
  VHS_FORCE_FFMPEG_PATH: /usr/bin/ffmpeg
host_requirements_policy:
  video-helper-suite:
    opencv-python:
      replacement: opencv-python-headless
      reason: Video decode/resize uses cv2 without GUI windows
      evidence_files: [videohelpersuite/load_video_nodes.py, videohelpersuite/server.py]
    imageio-ffmpeg:
      reason: Use the preinstalled system FFmpeg instead of another binary wheel
      evidence_files: [videohelpersuite/utils.py]
      requires_env:
        VHS_FORCE_FFMPEG_PATH: /usr/bin/ffmpeg
host_extra_requirements:
  matplotlib:
    source: kjnodes
    requirement: matplotlib
    reason: Host model/debug nodes render CUDA-memory and sigma plots
required_nodes:
  - manager
  - kjnodes
  - itools
  - sam3
  - video-helper-suite
  - depth-anything-v3
transitive_nodes:
  - multiband
  - geometry-pack
# Worker creation is separate from comfy-env's dependency resolver. Native
# register_nodes/SubprocessWorker still provide node metadata and execution.
workers:
  provider: uv-frozen-venv
  skip_host_ui_packages:
    - comfyui-frontend-package
    - comfyui-workflow-templates
    - comfyui-embedded-docs
  environments:
    sam3:
      source: sam3
      plugin_directory: ComfyUI-SAM3
      config: nodes/comfy-env.toml
      environment: sam3-nodes
      optional_pypi_omissions: {}
      cuda_policy: pytorch-sdpa
      optional_cuda_extensions: [cc_torch, torch_generic_nms, flash-attn]
      system_dependencies:
        av: pypi
        ffmpeg: system
    depth-anything-v3:
      source: depth-anything-v3
      plugin_directory: ComfyUI-DepthAnythingV3
      config: nodes/comfy-env.toml
      environment: depthanythingv3-nodes
      optional_pypi_omissions: {}
      cuda_policy: pytorch-sdpa
      optional_cuda_extensions: [flash_attn, sageattention]
      system_dependencies:
        av: pypi
        c-compiler: build-only
    itools:
      source: itools
      plugin_directory: ComfyUI-iTools
      adapter: itools
      config: build/adapters/itools/worker_nodes/comfy-env.toml
      environment: itools-workernodes
      optional_pypi_omissions: {}
      cuda_policy: pytorch-sdpa
      optional_cuda_extensions: []
      system_dependencies: {}
    kjnodes:
      source: kjnodes
      plugin_directory: ComfyUI-KJNodes
      adapter: kjnodes
      config: build/adapters/kjnodes/worker_nodes/comfy-env.toml
      environment: kjnodes-workernodes
      optional_pypi_omissions: {}
      cuda_policy: pytorch-sdpa
      optional_cuda_extensions: []
      system_dependencies: {}
    video-helper-suite:
      source: video-helper-suite
      plugin_directory: ComfyUI-VideoHelperSuite
      adapter: vhs
      config: build/adapters/vhs/worker_nodes/comfy-env.toml
      environment: videohelpersuite-workernodes
      optional_pypi_omissions: {}
      cuda_policy: pytorch-sdpa
      optional_cuda_extensions: []
      system_dependencies: {}
      root_requirements_policy:
        opencv-python:
          reason: Tensor-only workers do not import video loaders or cv2
          evidence_files: [videohelpersuite/image_latent_nodes.py]
        imageio-ffmpeg:
          reason: Use the system FFmpeg utility path; worker operators only transform tensors
          evidence_files: [videohelpersuite/utils.py]
          requires_env:
            VHS_FORCE_FFMPEG_PATH: /usr/bin/ffmpeg

# Minimal startup catalog for each managed default node (state-only generations).
runtime_required_nodes:
  sam3: [SAM3PointCollector]
  depth-anything-v3: [DepthAnything_V3]
  itools: [iToolsCheckerBoard]
  kjnodes: [ColorMatchV2]
  video-helper-suite: [VHS_VideoCombine]
